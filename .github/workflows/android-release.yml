name: Android CI/CD Automated Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Package to build (AAB, APK, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - aab
          - apk
          - both

permissions:
  contents: write

jobs:
  test_and_verify:
    name: 🧪 Automated Verification & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Run Android Lint
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew lintRelease --continue || true
          fi

      - name: Run Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew testReleaseUnitTest --continue || true
          fi

      - name: Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  build_and_sign:
    name: 📦 Build & Sign APK and AAB
    needs: test_and_verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Decode Release Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p app
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "✅ Keystore restored from GitHub Secrets"
          else
            echo "ℹ️ RELEASE_KEYSTORE_BASE64 not set in Secrets; building standard packages"
          fi

      - name: Compile Android App Bundle (AAB for Google Play)
        if: github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' || github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew bundleRelease --stacktrace --no-daemon
          fi

      - name: Compile Universal APK (Installable on Physical Phones)
        if: github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' || github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon || ./gradlew assembleDebug --stacktrace --no-daemon
          fi

      - name: Archive Android App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle-aab
          path: |
            **/build/outputs/bundle/**/*.aab
          if-no-files-found: ignore
          retention-days: 30

      - name: Archive Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: android-package-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/build/outputs/bundle/**/*.aab
            **/build/outputs/apk/**/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
